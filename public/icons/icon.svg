<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B5A3B" />
      <stop offset="100%" stop-color="#123D2A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DA89" />
      <stop offset="50%" stop-color="#D8B65C" />
      <stop offset="100%" stop-color="#A88329" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for iOS icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Golden Prayer Bead Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-dasharray="14 18" stroke-linecap="round" opacity="0.85" />
  
  <!-- Inner Ring Accent -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#EAF1E3" stroke-width="3" opacity="0.3" />

  <!-- Center Tasbih Bead Element -->
  <circle cx="256" cy="76" r="18" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="256" cy="46" r="10" fill="#EAF1E3" opacity="0.9" />

  <!-- Arabic Calligraphic Dhal / Tasbih Emblem -->
  <g filter="url(#glow)">
    <text x="256" y="325" font-family="'Amiri', 'Noto Naskh Arabic', serif" font-size="210" font-weight="bold" fill="#FBF8F1" text-anchor="middle">ذ</text>
  </g>

  <!-- Subtitle Text -->
  <text x="256" y="420" font-family="-apple-system, 'SF Pro Display', sans-serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">DZIKIRKU</text>
</svg>

