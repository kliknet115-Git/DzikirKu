<style>
:root{--navy:#18344d;--navy2:#244b63;--teal:#287a7b;--teal-soft:#e8f2f1;--gold:#c29a55;--bg:#f3f6f6;--card:#fff;--ink:#233444;--muted:#72808b;--line:#e6ebeb;--shadow:0 12px 34px rgba(20,48,66,.08);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid #79b8b4;outline-offset:3px}.app-shell{width:100%;max-width:480px;min-height:100dvh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}.statusbar{height:calc(12px + var(--safe-top));padding:var(--safe-top) 25px 0;display:flex;align-items:center;justify-content:space-between;color:#30475a;font-size:12px;font-weight:700;letter-spacing:.2px}.status-icons{letter-spacing:2px}.topbar{padding:14px 22px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#244b63,#277a7b);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 5px 14px #244b6330;flex:0 0 auto}.brand-name{font-size:18px;font-weight:780;letter-spacing:-.4px;color:var(--navy)}.brand-sub{font-size:10px;letter-spacing:1.55px;color:var(--teal);font-weight:850;margin-top:2px}.icon-btn{width:42px;height:42px;border-radius:15px;background:#fff;color:var(--navy);box-shadow:0 3px 13px #203f5510;display:grid;place-items:center;flex:0 0 auto}.icon-btn svg{width:19px;height:19px}.scroll-area{flex:1;overflow:auto;padding:2px 20px 112px;scrollbar-width:none}.scroll-area::-webkit-scrollbar{display:none}.eyebrow-row{display:flex;justify-content:space-between;align-items:center;padding:4px 3px 11px}.kicker{font-size:11px;font-weight:850;letter-spacing:1.6px;color:var(--teal)}.counter{font-size:12px;font-weight:750;color:#81909a;font-variant-numeric:tabular-nums}.intro{padding:3px 3px 18px}.intro h1{margin:0;color:var(--navy);font-size:27px;line-height:1.16;letter-spacing:-.7px;font-weight:780}.intro p{margin:7px 0 0;color:#7b8992;font-size:14px;line-height:1.5}.category-list{display:grid;gap:11px}.category-card{width:100%;display:flex;align-items:center;gap:13px;padding:15px 14px;border-radius:19px;background:#fff;border:1px solid #edf0ef;box-shadow:0 7px 22px rgba(20,48,66,.045);text-align:left;color:var(--ink);transition:transform .15s,border-color .15s}.category-card:active{transform:scale(.985)}.category-icon{width:47px;height:47px;border-radius:15px;background:#eaf2f3;display:grid;place-items:center;color:var(--teal);font-size:22px;flex:0 0 auto}.category-copy{min-width:0;flex:1}.category-title{display:block;color:var(--navy);font-size:15px;font-weight:780;line-height:1.3}.category-sub{display:block;color:#7c8a93;font-size:11px;line-height:1.45;margin-top:4px}.category-count{display:block;color:var(--teal);font-size:10px;font-weight:800;letter-spacing:.5px;margin-top:6px}.chevron{color:#9aa9b0;font-size:26px;line-height:1}.tip-card{margin-top:16px;padding:14px 15px;border-radius:16px;background:#eaf2f3;border:1px solid #dce9e9;color:#46606d;font-size:12px;line-height:1.5}.tip-title{color:var(--teal);font-size:10px;font-weight:850;letter-spacing:1.2px;margin-bottom:4px}.backline{display:flex;align-items:center;gap:9px;padding:0 2px 13px}.back-btn{width:34px;height:34px;border-radius:11px;background:#fff;border:1px solid #e7eded;color:var(--navy);display:grid;place-items:center}.back-btn svg{width:17px;height:17px}.back-label{font-size:12px;color:#7b8992;font-weight:700}.category-heading{padding:3px 3px 15px}.category-heading h1{font-size:24px;line-height:1.18;letter-spacing:-.55px;color:var(--navy);margin:0;font-weight:780}.category-heading p{font-size:13px;color:#7b8992;line-height:1.45;margin:7px 0 0}.item-list{display:grid;gap:8px}.item-row{width:100%;display:flex;gap:12px;align-items:center;padding:13px 12px;background:#fff;border:1px solid #edf0ef;border-radius:15px;text-align:left;color:var(--ink)}.item-row:active{background:#f7fbfa}.item-num{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:#edf3f3;color:var(--teal);display:grid;place-items:center;font-size:11px;font-weight:850;font-variant-numeric:tabular-nums}.item-copy{flex:1;min-width:0}.item-title{display:block;font-size:14px;color:var(--navy);font-weight:760;line-height:1.3}.item-meta{display:block;margin-top:3px;font-size:11px;color:#829098;line-height:1.35}.item-arrow{color:#a2afb5;font-size:22px}.progress-row{display:flex;justify-content:space-between;align-items:center;padding:2px 3px 10px}.title-block{padding:4px 3px 15px}.title-block h1{margin:0;color:var(--navy);font-size:24px;line-height:1.2;letter-spacing:-.6px;font-weight:780}.title-block .subline{margin-top:7px;color:#8a969d;font-size:12px;font-weight:650}.card{background:var(--card);border-radius:22px;border:1px solid #edf0ef;box-shadow:var(--shadow)}.arabic-card{padding:19px 16px 21px;position:relative;overflow:hidden}.arabic-card:before{content:"";position:absolute;top:0;left:22px;right:22px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#c29a55,#dfc58c)}.arabic-label{display:flex;align-items:center;gap:8px;color:var(--teal);font-size:11px;font-weight:850;letter-spacing:1.2px;margin:3px 0 13px}.arabic-label:before{content:"";width:17px;height:1px;background:var(--gold)}.arabic{font-family:"Noto Naskh Arabic","Geeza Pro","Amiri",serif;font-size:32px;line-height:2.02;text-align:center;direction:rtl;unicode-bidi:plaintext;color:#1e3042;white-space:pre-line;padding:0 1px;overflow-wrap:anywhere;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1;font-weight:500}.arabic.long{font-size:29px;line-height:2}.arabic.very-long{font-size:27px;line-height:1.95}.arabic-card.no-arabic{background:#fafdfe;border-style:dashed;box-shadow:none}.no-arabic-msg{font-size:16px;line-height:1.55;color:#506977;text-align:center;padding:14px 5px 18px}.latin-card,.meaning-card,.info-card{margin-top:14px;padding:16px 17px 17px}.section-heading{display:flex;align-items:center;gap:9px;margin:0 0 9px;color:var(--teal);font-size:11px;letter-spacing:1.4px;font-weight:850}.section-heading:before{content:"";width:17px;height:2px;background:var(--gold);border-radius:2px}.latin-text{font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.65;color:#596b76;font-style:italic;margin:0}.meaning-text{font-size:17px;line-height:1.62;letter-spacing:-.12px;color:#263847;margin:0}.note-card{margin-top:13px;padding:13px 15px;background:#eaf2f3;border:1px solid #dbe8e9;border-radius:16px;display:flex;gap:10px;align-items:flex-start}.note-icon{width:31px;height:31px;flex:0 0 31px;border-radius:10px;background:#d8e9e9;display:grid;place-items:center;color:var(--teal);font-size:16px}.note-copy{min-width:0}.note-title{font-size:10px;font-weight:850;color:#287477;letter-spacing:1.1px;margin:1px 0 5px}.note-text{font-size:13px;line-height:1.48;color:#2e4a59;font-weight:600}.pager{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);padding:12px 20px calc(12px + var(--safe-bottom));background:linear-gradient(180deg,#f3f6f600 0%,#f3f6f6ee 17%,#f3f6f6 50%);display:flex;gap:9px;align-items:center}.pager-btn{height:51px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:780}.pager-btn.secondary{width:51px;background:#fff;color:var(--navy);border:1px solid #e7eded}.pager-btn.primary{flex:1;background:var(--navy);color:#fff;box-shadow:0 7px 18px #18344d2a}.pager-btn svg{width:18px;height:18px}.pager-btn:disabled{opacity:.35;cursor:default}.list-btn{height:51px;width:51px;border-radius:15px;background:#fff;border:1px solid #e7eded;color:var(--teal);display:grid;place-items:center}.list-btn svg{width:20px;height:20px}.sheet-backdrop{position:fixed;inset:0;background:#142b3c55;z-index:10;opacity:0;pointer-events:none;transition:.22s}.sheet-backdrop.open{opacity:1;pointer-events:auto}.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,480px);max-height:83dvh;background:#f8fafa;border-radius:25px 25px 0 0;padding:10px 18px calc(18px + var(--safe-bottom));box-shadow:0 -15px 40px #102d4222;transition:.25s;display:flex;flex-direction:column}.sheet-backdrop.open .sheet{transform:translate(-50%,0)}.grabber{width:38px;height:4px;border-radius:4px;background:#cbd4d6;margin:0 auto 14px}.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 14px}.sheet-head h2{font-size:19px;color:var(--navy);margin:0}.sheet-head span{font-size:11px;color:#7d8b94;font-weight:650}.list-scroll{overflow:auto;padding-bottom:4px}.list-item{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px;margin-bottom:7px;border-radius:15px;background:#fff;border:1px solid #edf0ef;color:var(--ink)}.list-item.selected{border-color:#8ab6b3;background:#edf6f4}.list-title{display:block;font-size:13px;line-height:1.3;font-weight:740;color:var(--navy)}.list-meta{display:block;font-size:10px;color:#829098;margin-top:3px}.sheet-close{background:#eaf1f1;color:var(--navy);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700}
@media(min-width:600px){body{padding:25px 0}.app-shell{min-height:min(900px,calc(100dvh - 50px));height:min(900px,calc(100dvh - 50px));border-radius:36px;box-shadow:0 25px 80px #1b3d5522;border:7px solid #fff}.statusbar{height:37px;padding-top:4px}.pager{bottom:max(25px,calc((100dvh - min(900px,calc(100dvh - 50px)))/2));border-radius:0 0 28px 28px}.sheet{bottom:max(25px,calc((100dvh - min(900px,calc(100dvh - 50px)))/2));border-radius:25px}}
@media(max-width:380px){.arabic{font-size:29px;line-height:1.98}.arabic.long{font-size:27px}.arabic.very-long{font-size:25px}.title-block h1{font-size:22px}.meaning-text{font-size:16px}.scroll-area{padding-left:15px;padding-right:15px}}

<body>
<div class="app-shell" id="app">
  <div class="statusbar"><span id="clock">09.41</span><span class="status-icons" aria-hidden="true">●●●　◒　▰</span></div>
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">۞</div><div><div class="brand-name" id="brandName">Doa</div><div class="brand-sub" id="brandSub">KUMPULAN DOA</div></div></div>
    <button class="icon-btn" id="topAction" aria-label="Kembali ke daftar doa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </header>
  <main class="scroll-area" id="scrollArea"></main>
  <nav class="pager" id="pager" aria-label="Navigasi doa" hidden>
    <button class="pager-btn secondary" id="prevBtn" aria-label="Bacaan sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="list-btn" id="openList" aria-label="Daftar bacaan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>
    <button class="pager-btn primary" id="nextBtn">Bacaan berikutnya <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </nav>
</div>
<div class="sheet-backdrop" id="backdrop" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-label="Daftar doa"><div class="grabber"></div><div class="sheet-head"><h2 id="sheetTitle">Daftar doa</h2><button class="sheet-close" id="closeSheet">Tutup</button></div><div class="list-scroll" id="listScroll"></div></div></div>
<script>
const categories = [
 {id:'before',icon:'◉',title:'Sebelum dan Sesudah Berdoa',subtitle:'Bacaan pembuka dan penutup saat berdoa',countLabel:'3 BACAAN',items:[
  {title:'Doa Sebelum Berdoa',subtitle:'Memohon pengabulan doa dengan mengingat janji Allah',arabic:'يَا رَبِّ،\nأَنْتَ قُلْتَ وَقَوْلُكَ الْحَقُّ،\nاُدْعُونِي أَسْتَجِبْ لَكُمْ،\nوَأَنْتَ لَا تُخْلِفُ الْمِيعَادَ.',latin:"Ya Rabb, Anta qulta wa qawlukal haq. 'Ud'uni astajib lakum, wa anta la tukhliful mi'ad.",meaning:'Wahai Tuhanku, Engkau telah berfirman dan firman-Mu adalah benar: “Berdoalah kepada-Ku, niscaya akan Aku perkenankan bagimu”, dan Engkau tidak pernah mengingkari janji.'},
  {title:'Doa Memohon Pengabulan',subtitle:'Bacaan lanjutan sebelum memanjatkan doa',arabic:'اللَّهُمَّ اسْتَجِبْ كَمَا وَعَدْتَ.',latin:'Allāhumma-stajib kamā wa‘adta.',meaning:'Ya Allah, kabulkanlah sebagaimana Engkau telah berjanji.'},
  {title:'Doa Sesudah Berdoa',subtitle:'Memohon agar doa diterima dan dikabulkan',arabic:'اللَّهُمَّ تَقَبَّلْ دَعْوَانَا كَمَا أَمَرْتَنَا،\nفَاسْتَجِبْ كَمَا وَعَدْتَنَا،\nفَأَنْتَ يَا رَبِّ لَا تُخْلِفُ الْمِيعَادَ.',latin:"Allāhumma taqabbal da'awnāka kamā amartanā, fastajib kamā wa‘adtanā, fa anta yā rabbī lā tukhliful mi‘ād.",meaning:'Ya Allah, terimalah doa kami sebagaimana Engkau telah perintahkan kami. Dan kabulkanlah doa kami sebagaimana Engkau telah menjanjikan kepada kami. Sesungguhnya Engkau, wahai Rabb, tidak pernah mengingkari janji.'}
 ]},
 {id:'forgiveness',icon:'♡',title:'Doa Meminta Ampunan dan Rezeki',subtitle:'Memohon ampunan, kelapangan rumah, dan keberkahan rezeki',countLabel:'1 DOA',items:[
  {title:'Doa Meminta Ampunan dan Rezeki',subtitle:'Ampunan dosa, kelapangan rumah, dan keberkahan rezeki',arabic:'اللَّهُمَّ اغْفِرْ لِي ذَنْبِي،\nوَوَسِّعْ لِي فِي دَارِي،\nوَبَارِكْ لِي فِي رِزْقِي.',latin:"Allahumma ighfir lī dhanbi, wa wassi‘ lī fī dārī, wa bārik lī fī rizqī.",meaning:'Ya Allah, ampunilah dosa-dosaku, luaskanlah rumahku untukku, dan berkahilah rezekiku.'}
 ]},
 {id:'help',icon:'✧',title:'Doa Memohon Pertolongan',subtitle:'Memohon kekuatan, bantuan, kemenangan, dan petunjuk Allah',countLabel:'1 DOA',items:[
  {title:'Doa Memohon Pertolongan',subtitle:'Bersandar kepada daya dan kekuatan Allah',arabic:'اللَّهُمَّ إِنِّي أَتَبَرَّأُ مِنْ حَوْلِي وَقُوَّتِي،\nوَأَلْتَجِئُ إِلَى حَوْلِكَ وَقُوَّتِكَ.\nاللَّهُمَّ أَعِنِّي وَلَا تُعِنْ عَلَيَّ،\nوَانْصُرْنِي وَلَا تَنْصُرْ عَلَيَّ،\nوَاهْدِنِي وَيَسِّرِ الْهُدَى لِي.',meaning:'Ya Allah, aku berlepas diri dari daya dan kekuatanku, dan aku bersandar kepada daya dan kekuatan-Mu. Ya Allah, bantulah aku dan jangan biarkan aku, tolonglah aku dan jangan Engkau lemahkan aku. Berilah aku petunjuk dan mudahkan petunjuk itu bagiku.'}
 ]},
 {id:'umrah',icon:'☾',title:'Doa Umroh',subtitle:'Rangkaian doa perjalanan, tawaf, dan sa’i sesuai urutan lampiran',countLabel:'20 DOA / BACAAN',items:[
  {title:'Doa Keluar Rumah',arabic:'بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ،\nوَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.',meaning:'Dengan nama Allah, aku bertawakal kepada Allah. Tidak ada daya dan kekuatan kecuali dengan (pertolongan) Allah.'},
  {title:'Doa Setelah Duduk dalam Kendaraan',arabic:'بِسْمِ اللَّهِ مَجْرَاهَا وَمُرْسَاهَا،\nإِنَّ رَبِّي لَغَفُورٌ رَحِيمٌ.',meaning:'Dengan (menyebut) nama Allah pada waktu berlayar dan berlabuhnya. Sesungguhnya Tuhanku Maha Pengampun, Maha Penyayang.',note:'QS Hud: 41.'},
  {title:'Doa Ketika Kendaraan Mulai Bergerak',arabic:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ.\nاللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ.\nسُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا\nوَمَا كُنَّا لَهُ مُقْرِنِينَ،\nوَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ.',meaning:'Dengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang. Allah Mahabesar. Allah Mahabesar. Allah Mahabesar. Mahasuci Allah yang telah menggerakkan untuk kami kendaraan ini, padahal kami tidak kuasa menggerakkannya. Dan sesungguhnya kepada Tuhan kami pasti akan kembali.'},
  {title:'Niat Umroh',arabic:'لَبَّيْكَ اللَّهُمَّ عُمْرَةً.',meaning:'Aku penuhi panggilan-Mu, ya Allah, untuk menunaikan ibadah umrah.'},
  {title:'Bacaan Talbiyah',arabic:'لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ،\nلَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ،\nإِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ،\nلَا شَرِيكَ لَكَ.',meaning:'Aku datang memenuhi panggilan-Mu, ya Allah. Aku datang memenuhi panggilan-Mu. Tiada sekutu bagi-Mu. Aku datang memenuhi panggilan-Mu. Sungguh, segala puji, nikmat, dan segala kekuasaan adalah milik-Mu. Tiada sekutu bagi-Mu.'},
  {title:'Doa Masuk Masjid',arabic:'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ.',meaning:'Ya Allah, bukakanlah bagiku segala pintu rahmat-Mu.'},
  {title:'Doa Keluar Masjid',arabic:'اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ.',meaning:'Ya Allah, sesungguhnya aku memohon fadilah kepada-Mu.'},
  {title:'Doa Ketika Melihat Ka’bah',arabic:'اللَّهُمَّ زِدْ هَذَا الْبَيْتَ تَشْرِيفًا\nوَتَعْظِيمًا وَتَكْرِيمًا وَمَهَابَةً،\nوَزِدْ مَنْ شَرَّفَهُ وَكَرَّمَهُ مِمَّنْ حَجَّهُ\nأَوِ اعْتَمَرَهُ تَشْرِيفًا وَتَكْرِيمًا\nوَتَعْظِيمًا وَبِرًّا.',meaning:'Ya Allah, tambahkanlah kemuliaan, kehormatan, keagungan, dan kehebatan pada Baitullah ini; dan tambahkanlah pula kepada orang-orang yang memuliakan, menghormati, dan mengagungkannya di antara mereka yang berhaji atau yang berumrah kemuliaan, kehormatan, kebesaran, dan kebaikan.'},
  {title:'Doa Ketika Akan Memulai Tawaf',arabic:'اللَّهُمَّ إِيمَانًا بِكَ، وَتَصْدِيقًا بِكِتَابِكَ،\nوَوَفَاءً بِعَهْدِكَ، وَاتِّبَاعًا لِسُنَّةِ نَبِيِّكَ\nمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.',meaning:'Ya Allah, seraya iman kepada-Mu, membenarkan kitab-Mu, menepati janji kepada-Mu, serta mengikuti sunah Nabi-Mu, Muhammad ﷺ.'},
  {title:'Doa Tawaf di Setiap Posisi Hajar Aswad',arabic:'بِسْمِ اللَّهِ، اللَّهُ أَكْبَرُ.',meaning:'Dengan nama Allah, Allah Mahabesar.'},
  {title:'Doa Tawaf dari Hajar Aswad ke Maqam Ibrahim',arabic:'سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ،\nوَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ.\nوَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ.',meaning:'Mahasuci Allah. Segala pujian hanya pantas disanjungkan kepada Allah. Tiada Tuhan selain Allah. Allah Mahabesar. Tidak ada daya dan kekuatan kecuali (pertolongan) dari Allah Yang Mahaluhur lagi Mahaagung.'},
  {title:'Doa Tawaf dari Maqam Ibrahim ke Rukun Yamani',arabic:'',meaning:'Berdo’a Bebas',note:'Lampiran tidak mencantumkan lafaz khusus untuk bagian ini.'},
  {title:'Doa Tawaf dari Rukun Yamani ke Hajar Aswad',arabic:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً،\nوَفِي الْآخِرَةِ حَسَنَةً،\nوَقِنَا عَذَابَ النَّارِ.',meaning:'Wahai Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan hindarkanlah kami dari siksa neraka.'},
  {title:'Doa Menuju Maqam Ibrahim',arabic:'وَاتَّخِذُوا مِنْ مَقَامِ إِبْرَاهِيمَ مُصَلًّى.',meaning:'Dan jadikanlah bagian dari maqam Ibrahim itu sebagai tempat salat.',note:'QS Al-Baqarah: 125.'},
  {title:'Doa Minum Air Zamzam',arabic:'اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا،\nوَرِزْقًا وَاسِعًا، وَشِفَاءً مِنْ كُلِّ دَاءٍ\nوَسَقَمٍ بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.',meaning:'Ya Allah, sesungguhnya aku bermohon kepada-Mu ilmu yang bermanfaat, rezeki yang luas, dan penawar bagi segala penyakit; dengan rahmat-Mu, wahai Tuhan Yang Maha Pengasih lagi Maha Penyayang.'},
  {title:'Doa Menuju Bukit Shafa',arabic:'إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ.',meaning:'Sesungguhnya Shafa dan Marwah merupakan sebagian syiar (agama) Allah.'},
  {title:'Doa Menaiki Bukit Shafa',arabic:'أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ.',meaning:'Aku memulai sa’i dengan apa yang didahulukan oleh Allah.'},
  {title:'Doa Ketika Berada di Bukit Shafa dan Marwah',arabic:'اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ.\nلَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ،\nلَهُ الْمُلْكُ وَلَهُ الْحَمْدُ،\nوَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.\nلَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ،\nأَنْجَزَ وَعْدَهُ، وَنَصَرَ عَبْدَهُ،\nوَهَزَمَ الْأَحْزَابَ وَحْدَهُ.',meaning:'Allah Mahabesar (3 kali). Tiada Tuhan yang berhak disembah selain Allah, Yang Maha Esa, tiada sekutu bagi-Nya. Bagi-Nya kerajaan dan pujian. Dia-lah Yang Mahakuasa atas segala sesuatu. Tiada Tuhan yang berhak disembah selain Allah Yang Maha Esa, yang melaksanakan janji-Nya, membela hamba-Nya (Muhammad), dan mengalahkan golongan musuh sendirian.'},
  {title:'Doa Sa’i dari Bukit Shafa ke Marwah',arabic:'',meaning:'Berdo’a Bebas',note:'Lampiran tidak mencantumkan lafaz khusus untuk bagian ini.'},
  {title:'Doa Sa’i di Pilar Lampu Hijau',arabic:'اللَّهُمَّ اغْفِرْ وَارْحَمْ،\nوَأَنْتَ الْأَعَزُّ الْأَكْرَمُ.',meaning:'Ya Rabbku, ampuni dan rahmatilah aku. Sesungguhnya Engkaulah Yang Maha Perkasa dan Maha Pemurah.'}
 ]},
 {id:'janazah',icon:'☼',title:'Sholat Jenazah',subtitle:'Bacaan pada empat takbir dan salam',countLabel:'4 TAKBIR + SALAM',items:[
  {title:'Takbir Pertama — Al-Fatihah',subtitle:'Membaca Surah Al-Fatihah',arabic:'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ.\nبِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ.\nالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ.\nالرَّحْمَٰنِ الرَّحِيمِ.\nمَالِكِ يَوْمِ الدِّينِ.\nإِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ.\nاهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ.\nصِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ\nغَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ.',meaning:'Dengan menyebut nama Allah Yang Maha Pemurah lagi Maha Penyayang. Segala puji bagi Allah, Tuhan semesta alam. Maha Pemurah lagi Maha Penyayang. Yang Menguasai Hari Pembalasan. Hanya Engkaulah yang kami sembah dan hanya kepada Engkaulah kami meminta pertolongan. Tunjukilah kami jalan yang lurus, (yaitu) jalan orang-orang yang telah Engkau beri nikmat kepada mereka; bukan (jalan) mereka yang dimurkai dan bukan (pula) mereka yang sesat.',note:'QS Al-Fatihah: 1–7.'},
  {title:'Takbir Kedua — Sholawat',subtitle:'Sholawat kepada Nabi Muhammad ﷺ',arabic:'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ،\nكَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ،\nإِنَّكَ حَمِيدٌ مَجِيدٌ.\nاللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ،\nكَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ،\nإِنَّكَ حَمِيدٌ مَجِيدٌ.',meaning:'Ya Allah, berilah rahmat kepada Nabi Muhammad dan keluarga Nabi Muhammad sebagaimana Engkau telah memberikan rahmat kepada Nabi Ibrahim dan keluarga Nabi Ibrahim. Sesungguhnya Engkau Maha Terpuji lagi Maha Mulia. Ya Allah, berilah keberkahan kepada Nabi Muhammad dan keluarga Nabi Muhammad sebagaimana Engkau telah memberikan keberkahan kepada Nabi Ibrahim dan keluarga Nabi Ibrahim. Sesungguhnya Engkau Maha Terpuji lagi Maha Mulia.'},
  {title:'Takbir Ketiga — Doa untuk Jenazah',subtitle:'Memohon ampunan dan rahmat bagi jenazah',arabic:'اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ،\nوَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ،\nوَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ،\nوَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ،\nوَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ،\nوَأَهْلًا خَيْرًا مِنْ أَهْلِهِ،\nوَزَوْجًا خَيْرًا مِنْ زَوْجِهِ، وَأَدْخِلْهُ الْجَنَّةَ،\nوَأَعِذْهُ مِنْ عَذَابِ الْقَبْرِ أَوْ مِنْ عَذَابِ النَّارِ.',meaning:'Ya Allah, ampunilah dan rahmatilah dia. Bebaskanlah dan maafkanlah dia. Luaskanlah kuburnya dan mandikanlah ia dengan air, salju, dan embun. Sucikan ia dari seluruh kesalahan seperti dibersihkannya kain putih dari kotoran. Berikan ia rumah yang lebih baik dari rumahnya (di dunia), keluarga yang lebih baik dari keluarganya, pasangan yang lebih baik dari pasangannya. Lalu masukkanlah ia ke dalam surga dan lindungilah ia dari cobaan kubur dan azab neraka.'},
  {title:'Takbir Keempat — Doa',subtitle:'Memohon pahala dan ampunan',arabic:'اللَّهُمَّ لَا تَحْرِمْنَا أَجْرَهُ،\nوَلَا تَفْتِنَّا بَعْدَهُ،\nوَاغْفِرْ لَنَا وَلَهُ.',meaning:'Ya Allah, jangan haramkan kami dari pahalanya dan jangan cobai kami sepeninggalnya. Ampunilah kami dan ampunilah dia.'},
  {title:'Salam',subtitle:'Penutup sholat jenazah',arabic:'السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ.',meaning:'Semoga keselamatan, rahmat Allah, dan berkah-Nya dilimpahkan kepada kalian.'}
 ]}
];
let view='home',activeCat=null,activeIndex=0;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function currentCategory(){return categories.find(c=>c.id===activeCat)}
function renderHome(){view='home';activeCat=null;$('pager').hidden=true;$('brandName').textContent='Doa';$('brandSub').textContent='KUMPULAN DOA';$('topAction').style.visibility='hidden';$('scrollArea').innerHTML=`<div class="eyebrow-row"><span class="kicker">MENU DOA</span><span class="counter">05 KATEGORI</span></div><section class="intro"><h1>Kumpulan Doa</h1><p>Pilih kumpulan doa yang ingin dibaca. Setiap bacaan disusun mengikuti urutan dokumen sumber.</p></section><section class="category-list">${categories.map(c=>`<button class="category-card" data-cat="${c.id}"><span class="category-icon">${c.icon}</span><span class="category-copy"><span class="category-title">${esc(c.title)}</span><span class="category-sub">${esc(c.subtitle)}</span><span class="category-count">${esc(c.countLabel)}</span></span><span class="chevron">›</span></button>`).join('')}</section><div class="tip-card"><div class="tip-title">PANDUAN</div>Ketuk salah satu kategori untuk melihat daftar bacaan. Gunakan tombol sebelumnya, berikutnya, atau daftar bacaan untuk berpindah halaman.</div>`;$('scrollArea').scrollTo({top:0});$('scrollArea').querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>openCategory(b.dataset.cat)));}
function openCategory(id){activeCat=id;activeIndex=0;view='category';const c=currentCategory();$('pager').hidden=true;$('brandName').textContent='Doa';$('brandSub').textContent='KUMPULAN DOA';$('topAction').style.visibility='visible';$('scrollArea').innerHTML=`<div class="backline"><button class="back-btn" id="backHome" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><span class="back-label">Semua kategori doa</span></div><div class="eyebrow-row"><span class="kicker">KATEGORI DOA</span><span class="counter">${esc(c.countLabel)}</span></div><section class="category-heading"><h1>${esc(c.title)}</h1><p>${esc(c.subtitle)}</p></section><section class="item-list">${c.items.map((it,i)=>`<button class="item-row" data-item="${i}"><span class="item-num">${String(i+1).padStart(2,'0')}</span><span class="item-copy"><span class="item-title">${esc(it.title)}</span><span class="item-meta">${esc(it.subtitle||'Bacaan doa')}</span></span><span class="item-arrow">›</span></button>`).join('')}</section>`;$('scrollArea').scrollTo({top:0});$('backHome').addEventListener('click',renderHome);$('scrollArea').querySelectorAll('[data-item]').forEach(b=>b.addEventListener('click',()=>openDetail(Number(b.dataset.item))));}
function openDetail(index){view='detail';activeIndex=index;const c=currentCategory();const it=c.items[index];$('pager').hidden=false;$('brandName').textContent=c.title;$('brandSub').textContent='DOA HARIAN';$('topAction').style.visibility='visible';renderDetail();}
function renderDetail(){const c=currentCategory();const it=c.items[activeIndex];const count=c.items.length;const num=String(activeIndex+1).padStart(2,'0');const arabicClass=(it.arabic||'').length>360?'very-long':(it.arabic||'').length>190?'long':'';let body=`<div class="backline"><button class="back-btn" id="backCategory" aria-label="Kembali ke daftar kategori"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><span class="back-label">${esc(c.title)}</span></div><div class="progress-row"><span class="kicker">${esc(c.title.toUpperCase())}</span><span class="counter">${num} / ${String(count).padStart(2,'0')}</span></div><section class="title-block"><h1>${esc(it.title)}</h1>${it.subtitle?`<div class="subline">${esc(it.subtitle)}</div>`:''}</section><section class="card arabic-card ${it.arabic?'':'no-arabic'}">${it.arabic?'':`<div class="arabic-label">KETERANGAN</div>`}${it.arabic?`<div class="arabic ${arabicClass}" lang="ar" dir="rtl">${esc(it.arabic)}</div>`:`<div class="no-arabic-msg">${esc(it.meaning)}</div>`}</section>`;
 if(it.latin)body+=`<section class="card latin-card"><h2 class="section-heading">TRANSLITERASI</h2><p class="latin-text">${esc(it.latin)}</p></section>`;
 if(it.arabic)body+=`<section class="card meaning-card"><h2 class="section-heading">ARTI / MAKNA</h2><p class="meaning-text">${esc(it.meaning)}</p></section>`;
 if(it.note)body+=`<div class="note-card"><div class="note-icon">i</div><div class="note-copy"><div class="note-title">CATATAN</div><div class="note-text">${esc(it.note)}</div></div></div>`;
 $('scrollArea').innerHTML=body;$('scrollArea').scrollTo({top:0,behavior:'smooth'});$('backCategory').addEventListener('click',()=>openCategory(activeCat));$('prevBtn').disabled=activeIndex===0;$('nextBtn').innerHTML=activeIndex===count-1?'Kembali ke awal <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>':'Bacaan berikutnya <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';}
function next(delta){const c=currentCategory();const n=activeIndex+delta;if(n<0||n>=c.items.length){if(delta>0){activeIndex=0;renderDetail()}return;}activeIndex=n;renderDetail();}
function openSheet(){const c=currentCategory();$('sheetTitle').textContent='Daftar '+c.title;$('listScroll').innerHTML=c.items.map((it,i)=>`<button class="list-item ${i===activeIndex?'selected':''}" data-index="${i}"><span class="item-num">${String(i+1).padStart(2,'0')}</span><span class="item-copy"><span class="list-title">${esc(it.title)}</span><span class="list-meta">${esc(it.subtitle||c.title)}</span></span><span class="item-arrow">›</span></button>`).join('');$('listScroll').querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>{activeIndex=Number(b.dataset.index);renderDetail();closeSheet()}));$('backdrop').classList.add('open');$('backdrop').setAttribute('aria-hidden','false');}
function closeSheet(){$('backdrop').classList.remove('open');$('backdrop').setAttribute('aria-hidden','true')}
$('topAction').addEventListener('click',()=>{if(view==='detail')openSheet();else if(view==='category')renderHome();});$('prevBtn').addEventListener('click',()=>next(-1));$('nextBtn').addEventListener('click',()=>next(1));$('openList').addEventListener('click',openSheet);$('closeSheet').addEventListener('click',closeSheet);$('backdrop').addEventListener('click',e=>{if(e.target===$('backdrop'))closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(view==='detail'&&e.key==='ArrowRight')next(1);if(view==='detail'&&e.key==='ArrowLeft')next(-1)});
let now=new Date();$('clock').textContent=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false}).replace(':','.');renderHome();
</script>
</body>
