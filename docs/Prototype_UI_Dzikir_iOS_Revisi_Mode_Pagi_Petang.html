<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Dzikir Pagi & Petang — iOS UI Prototype</title>
<style>
:root{--navy:#18344d;--navy2:#244b63;--teal:#287a7b;--teal-soft:#e8f2f1;--gold:#c29a55;--bg:#f3f6f6;--card:#fff;--ink:#233444;--muted:#72808b;--line:#e6ebeb;--shadow:0 12px 34px rgba(20,48,66,.08);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid #79b8b4;outline-offset:3px}
.app-shell{width:100%;max-width:480px;min-height:100dvh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.statusbar{height:calc(12px + var(--safe-top));padding:var(--safe-top) 25px 0;display:flex;align-items:center;justify-content:space-between;color:#30475a;font-size:12px;font-weight:700;letter-spacing:.2px}
.topbar{padding:14px 22px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#244b63,#277a7b);display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 5px 14px #244b6330}.brand-name{font-size:17px;font-weight:750;letter-spacing:-.35px;color:var(--navy)}.brand-sub{font-size:10px;letter-spacing:1.45px;color:var(--teal);font-weight:800;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:14px;background:#fff;color:var(--navy);box-shadow:0 3px 13px #203f5510;display:grid;place-items:center}.icon-btn svg{width:19px;height:19px}
.mode-wrap{padding:0 22px 16px}.mode-switch{display:flex;background:#e7eded;padding:4px;border-radius:14px;gap:4px}.mode-switch button{flex:1;padding:11px 10px;border-radius:11px;background:transparent;color:#667781;font-weight:700;font-size:14px;transition:.18s}.mode-switch button.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px #19384d14}
.scroll-area{flex:1;overflow:auto;padding:2px 20px 112px;scrollbar-width:none}.scroll-area::-webkit-scrollbar{display:none}
.progress-row{display:flex;justify-content:space-between;align-items:center;padding:2px 3px 10px}.kicker{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--teal)}.counter{font-size:12px;font-weight:700;color:#81909a;font-variant-numeric:tabular-nums}
.title-block{padding:4px 3px 15px}.title-block h1{margin:0;color:var(--navy);font-size:24px;line-height:1.2;letter-spacing:-.6px;font-weight:760}.title-block .subline{margin-top:7px;color:#8a969d;font-size:12px;font-weight:600}
.card{background:var(--card);border-radius:22px;border:1px solid #edf0ef;box-shadow:var(--shadow)}.arabic-card{padding:19px 16px 20px;position:relative;overflow:hidden}.arabic-card:before{content:"";position:absolute;top:0;left:22px;right:22px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#c29a55,#dfc58c)}
.arabic-label{display:flex;align-items:center;gap:8px;color:var(--teal);font-size:11px;font-weight:800;letter-spacing:1.2px;margin:3px 0 12px}.arabic-label:before{content:"";width:17px;height:1px;background:var(--gold)}
.arabic{font-family:"Noto Naskh Arabic","Geeza Pro","Amiri",serif;font-size:31px;line-height:2.08;text-align:center;direction:rtl;unicode-bidi:plaintext;color:#1e3042;white-space:pre-line;padding:0 1px;overflow-wrap:anywhere;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1;font-weight:500}
.frequency-card{margin-top:14px;padding:14px 15px 15px;background:#eaf2f3;border:1px solid #dbe8e9;border-radius:16px;display:flex;gap:11px;align-items:flex-start}.freq-icon{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:#d8e9e9;display:grid;place-items:center;color:var(--teal)}.freq-icon svg{width:17px;height:17px}.freq-title{font-size:10px;font-weight:850;color:#287477;letter-spacing:1.1px;margin:1px 0 5px}.freq-text{font-size:14px;line-height:1.5;color:#2e4a59;font-weight:620}
.meaning-card{margin-top:16px;padding:18px 18px 19px}.section-heading{display:flex;align-items:center;gap:9px;margin:0 0 9px;color:var(--teal);font-size:11px;letter-spacing:1.5px;font-weight:850}.section-heading:before{content:"";width:17px;height:2px;background:var(--gold);border-radius:2px}.meaning-text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;font-size:18px;line-height:1.62;letter-spacing:-.13px;color:#263847;margin:0}
.pager{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);padding:12px 20px calc(12px + var(--safe-bottom));background:linear-gradient(180deg,#f3f6f600 0%,#f3f6f6ee 17%,#f3f6f6 50%);display:flex;gap:10px;align-items:center}.pager-btn{height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:750}.pager-btn.secondary{width:52px;background:#fff;color:var(--navy);border:1px solid #e7eded}.pager-btn.primary{flex:1;background:var(--navy);color:#fff;box-shadow:0 7px 18px #18344d2a}.pager-btn svg{width:18px;height:18px}.pager-btn:disabled{opacity:.35;cursor:default}.list-btn{height:50px;width:52px;border-radius:15px;background:#fff;border:1px solid #e7eded;color:var(--teal);display:grid;place-items:center}.list-btn svg{width:20px;height:20px}
.sheet-backdrop{position:fixed;inset:0;background:#142b3c55;z-index:10;opacity:0;pointer-events:none;transition:.22s}.sheet-backdrop.open{opacity:1;pointer-events:auto}.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,480px);max-height:83dvh;background:#f8fafa;border-radius:25px 25px 0 0;padding:10px 18px calc(18px + var(--safe-bottom));box-shadow:0 -15px 40px #102d4222;transition:.25s;display:flex;flex-direction:column}.sheet-backdrop.open .sheet{transform:translate(-50%,0)}.grabber{width:38px;height:4px;border-radius:4px;background:#cbd4d6;margin:0 auto 14px}.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 14px}.sheet-head h2{font-size:20px;color:var(--navy);margin:0}.sheet-head span{font-size:12px;color:#7d8b94;font-weight:650}.list-scroll{overflow:auto;padding-bottom:4px}.list-item{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:13px 12px;margin-bottom:7px;border-radius:15px;background:#fff;border:1px solid #edf0ef;color:var(--ink)}.list-item.selected{border-color:#8ab6b3;background:#edf6f4}.list-num{width:34px;height:34px;border-radius:11px;background:#edf3f3;color:var(--teal);display:grid;place-items:center;font-size:12px;font-weight:850;font-variant-numeric:tabular-nums;flex:0 0 auto}.list-item.selected .list-num{background:var(--teal);color:#fff}.list-copy{min-width:0;flex:1}.list-title{display:block;font-size:14px;line-height:1.3;font-weight:740;color:var(--navy)}.list-meta{display:block;font-size:11px;color:#829098;margin-top:3px}.list-arrow{color:#9aabb0;font-size:22px}
@media(min-width:600px){body{padding:25px 0}.app-shell{min-height:min(900px,calc(100dvh - 50px));height:min(900px,calc(100dvh - 50px));border-radius:36px;box-shadow:0 25px 80px #1b3d5522;border:7px solid #fff}.statusbar{height:37px;padding-top:4px}.pager{bottom:max(25px,calc((100dvh - min(900px,calc(100dvh - 50px)))/2));border-radius:0 0 28px 28px}.sheet{bottom:max(25px,calc((100dvh - min(900px,calc(100dvh - 50px)))/2));border-radius:25px}}
@media(max-width:380px){.arabic{font-size:28px;line-height:2}.title-block h1{font-size:22px}.meaning-text{font-size:17px}.scroll-area{padding-left:15px;padding-right:15px}}
</style>
</head>
<body>
<div class="app-shell" id="app">
  <div class="statusbar"><span id="clock">09:41</span><span aria-hidden="true">●●●　◒　▰</span></div>
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">۞</div><div><div class="brand-name">Dzikir Pagi & Petang</div><div class="brand-sub">DZIKIR HARIAN</div></div></div>
    <button class="icon-btn" id="openListTop" aria-label="Buka daftar dzikir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </header>
  <div class="mode-wrap"><div class="mode-switch" role="group" aria-label="Pilih waktu dzikir"><button class="active" data-mode="pagi" aria-pressed="true">Pagi</button><button data-mode="petang" aria-pressed="false">Petang</button></div></div>
  <main class="scroll-area" id="scrollArea">
    <div class="progress-row"><span class="kicker" id="modeKicker">DZIKIR PAGI</span><span class="counter" id="counter">01 / 18</span></div>
    <section class="title-block"><h1 id="entryTitle">Ayat Kursi - Surah Al-Baqarah ayat 255</h1></section>
    <section class="card arabic-card"><div class="arabic-label">BACAAN ARAB</div><div class="arabic" id="arabicText" lang="ar" dir="rtl"></div></section>
    <section class="frequency-card"><div class="freq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div><div class="freq-title">JUMLAH / WAKTU</div><div class="freq-text" id="frequencyText"></div></div></section>
    <section class="card meaning-card"><h2 class="section-heading">MAKNA</h2><p class="meaning-text" id="meaningText"></p></section>
  </main>
  <nav class="pager" aria-label="Navigasi bacaan">
    <button class="pager-btn secondary" id="prevBtn" aria-label="Bacaan sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="list-btn" id="openListBottom" aria-label="Daftar bacaan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
    <button class="pager-btn primary" id="nextBtn">Bacaan berikutnya <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </nav>
</div>
<div class="sheet-backdrop" id="backdrop" aria-hidden="true">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grabber"></div><div class="sheet-head"><h2 id="sheetTitle">Daftar Dzikir</h2><span id="entryCount">19 bacaan</span></div>
    <div class="list-scroll" id="listScroll"></div>
  </section>
</div>
<script>
const pagiEntries = [{"no":1,"title":"Ayat Kursi - Surah Al-Baqarah ayat 255","arabic":"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ.\nاللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ.","frequency":"1 kali pada pagi hari. Ayat ini adalah Al-Qur’an, Surah Al-Baqarah [2]:255.","meaning":"Allah, tidak ada sesembahan yang berhak disembah selain Dia, Yang Maha Hidup dan terus-menerus mengurus makhluk-Nya. Dia tidak mengantuk dan tidak tidur. Milik-Nya segala yang ada di langit dan di bumi. Tidak ada yang dapat memberi syafaat di sisi-Nya kecuali dengan izin-Nya. Dia mengetahui apa yang ada di hadapan dan di belakang mereka. Mereka tidak mengetahui apa pun dari ilmu-Nya kecuali apa yang Dia kehendaki. Kursi-Nya meliputi langit dan bumi. Dia tidak merasa berat memelihara keduanya. Dia Mahatinggi lagi Mahaagung."},{"no":2,"title":"Surah Al-Ikhlas","arabic":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ.\nقُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.","frequency":"3 kali pada pagi dan 3 kali pada petang, bersama Al-Falaq dan An-Nas.","meaning":"Dengan nama Allah Yang Maha Pengasih, Maha Penyayang. Katakanlah: Dialah Allah Yang Maha Esa. Allah tempat bergantung segala sesuatu. Dia tidak beranak dan tidak pula diperanakkan. Tidak ada sesuatu pun yang setara dengan-Nya."},{"no":3,"title":"Surah Al-Falaq","arabic":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ.\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ.","frequency":"3 kali pada pagi dan 3 kali pada petang, bersama Al-Ikhlas dan An-Nas.","meaning":"Katakanlah, “Aku berlindung kepada Rabb yang menguasai subuh, dari kejahatan makhluk yang Dia ciptakan, dari kejahatan malam apabila telah gelap, dari kejahatan para peniup pada buhul-buhul, dan dari kejahatan orang yang dengki ketika ia dengki.”"},{"no":4,"title":"Surah An-Nas","arabic":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ.\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ.","frequency":"3 kali pada pagi dan 3 kali pada petang, bersama Al-Ikhlas dan Al-Falaq.","meaning":"Katakanlah, “Aku berlindung kepada Rabb manusia, Raja manusia, sesembahan manusia, dari kejahatan bisikan setan yang bersembunyi, yang membisikkan ke dalam dada manusia, dari golongan jin dan manusia.”"},{"no":5,"title":"Allahumma bika asbahna wa bika amsayna","arabic":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.","frequency":"1 kali pada pagi hari. Untuk petang, ubah susunan awal lafaz menjadi “بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا”.","meaning":"Ya Allah, dengan pertolongan dan kehendak-Mu kami memasuki pagi dan petang. Dengan kehendak-Mu kami hidup dan mati, dan kepada-Mu kami dibangkitkan."},{"no":6,"title":"Asbahna ‘ala fitratil-Islam","arabic":"أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا، وَمَا كَانَ مِنَ الْمُشْرِكِينَ.","frequency":"1 kali pada pagi hari. Lampiran mencantumkan lafaz “أَصْبَحْنَا”.","meaning":"Kami memasuki pagi di atas fitrah Islam, kalimat keikhlasan, agama Nabi kami Muhammad ﷺ, dan millah ayah kami Ibrahim yang lurus serta berserah diri; beliau bukan termasuk orang-orang musyrik."},{"no":7,"title":"Asbahna wa asbahal-mulku lillah","arabic":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ. رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ. رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.","frequency":"1 kali pada pagi hari. Untuk petang terdapat penggantian “أَصْبَحْنَا” menjadi “أَمْسَيْنَا” pada permulaan.","meaning":"Kami memasuki pagi dan seluruh kerajaan adalah milik Allah. Segala puji bagi Allah. Tidak ada sesembahan yang berhak disembah selain Allah semata, tidak ada sekutu bagi-Nya. Milik-Nya kerajaan dan segala pujian, dan Dia Mahakuasa atas segala sesuatu. Rabbku, aku memohon kebaikan hari ini dan kebaikan setelahnya, serta berlindung dari keburukan hari ini dan setelahnya. Aku berlindung dari kemalasan, usia tua yang buruk, azab neraka, dan azab kubur."},{"no":8,"title":"Sayyidul Istighfar","arabic":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.","frequency":"1 kali pada pagi dan 1 kali pada petang.","meaning":"Ya Allah, Engkaulah Rabbku. Tidak ada sesembahan yang berhak disembah selain Engkau. Engkau menciptakanku dan aku adalah hamba-Mu. Aku berpegang pada janji kepada-Mu semampuku. Aku berlindung kepada-Mu dari keburukan perbuatanku. Aku mengakui nikmat-Mu atasku dan mengakui dosaku. Maka ampunilah aku, karena tidak ada yang mengampuni dosa selain Engkau."},{"no":9,"title":"Allahumma ‘afini fi badani","arabic":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ.","frequency":"3 kali pada pagi dan 3 kali pada petang. Kedua bagian doa dibaca dalam rangkaian yang sama.","meaning":"Ya Allah, karuniakanlah keselamatan pada tubuhku, pendengaranku, dan penglihatanku. Tidak ada sesembahan yang berhak disembah selain Engkau. Ya Allah, aku berlindung kepada-Mu dari kekufuran, kefakiran, dan azab kubur. Tidak ada sesembahan yang berhak disembah selain Engkau."},{"no":10,"title":"Allahumma inni as’alukal-‘afwa wal-‘afiyah","arabic":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ. اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي. اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي. اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.","frequency":"1 kali pada pagi dan 1 kali pada petang.","meaning":"Ya Allah, aku memohon ampunan dan keselamatan di dunia dan akhirat. Aku memohon ampunan dan keselamatan dalam agama, urusan dunia, keluarga, dan hartaku. Tutupilah aibku dan tenteramkanlah rasa takutku. Lindungilah aku dari depan, belakang, kanan, kiri, dan atasku. Dengan keagungan-Mu, aku berlindung dari kebinasaan yang datang dari bawahku."},{"no":11,"title":"Allahumma ‘alimal-ghaibi wasy-syahadah","arabic":"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ.","frequency":"1 kali pada pagi, petang, dan sebelum tidur.","meaning":"Ya Allah, Yang mengetahui yang gaib dan yang nyata, Pencipta langit dan bumi, Rabb serta Penguasa segala sesuatu. Aku bersaksi bahwa tidak ada sesembahan yang berhak disembah selain Engkau. Aku berlindung kepada-Mu dari kejahatan diriku, setan dan ajakan kesyirikannya, serta dari melakukan keburukan terhadap diriku atau menyeret seorang Muslim ke dalamnya."},{"no":12,"title":"Bismillahilladzi la yadurru","arabic":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ.","frequency":"3 kali pada pagi dan 3 kali pada petang.","meaning":"Dengan nama Allah, yang bersama nama-Nya tidak ada sesuatu pun di bumi maupun di langit yang dapat menimbulkan mudarat. Dia Maha Mendengar lagi Maha Mengetahui."},{"no":13,"title":"Raditu billahi rabba","arabic":"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.","frequency":"3 kali pada pagi dan 3 kali pada petang.","meaning":"Aku rela Allah sebagai Rabbku, Islam sebagai agamaku, dan Muhammad ﷺ sebagai Nabiku."},{"no":14,"title":"Ya Hayyu ya Qayyum","arabic":"يَا حَيُّ يَا قَيُّومُ، بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.","frequency":"1 kali pada pagi dan 1 kali pada petang.","meaning":"Wahai Yang Maha Hidup dan terus-menerus mengurus seluruh makhluk, dengan rahmat-Mu aku memohon pertolongan. Perbaikilah seluruh urusanku dan jangan serahkan aku kepada diriku sendiri walau sekejap mata."},{"no":15,"title":"La ilaha illallah wahdahu la syarika lah","arabic":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","frequency":"Beberapa riwayat menyebut 1 kali; riwayat lain 10 kali; dan riwayat Abu Hurairah menyebut 100 kali dalam sehari. Lihat rincian di catatan takhrij.","meaning":"Tidak ada sesembahan yang berhak disembah selain Allah semata, tidak ada sekutu bagi-Nya. Milik-Nya kerajaan dan segala pujian, dan Dia Mahakuasa atas segala sesuatu."},{"no":16,"title":"Subhanallahi wa bihamdihi ‘adada khalqihi","arabic":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ.","frequency":"3 kali pada pagi hari.","meaning":"Mahasuci Allah dan segala puji bagi-Nya sebanyak bilangan makhluk-Nya, sesuai keridaan-Nya, seberat timbangan Arasy-Nya, dan sebanyak tinta untuk menuliskan kalimat-kalimat-Nya."},{"no":17,"title":"Allahumma inni as’aluka ‘ilman nafi‘an","arabic":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.","frequency":"1 kali setelah salam salat Subuh.","meaning":"Ya Allah, aku memohon kepada-Mu ilmu yang bermanfaat, rezeki yang baik dan halal, serta amal yang diterima."},{"no":18,"title":"Subhanallahi wa bihamdihi","arabic":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.","frequency":"100 kali dalam sehari. Lampiran menempatkannya dalam rangkaian dzikir pagi.","meaning":"Mahasuci Allah dan segala puji bagi-Nya."},{"no":19,"title":"Astaghfirullah wa atubu ilaih","arabic":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ.","frequency":"100 kali dalam sehari, berdasarkan riwayat Sahih Muslim. Lampiran menempatkannya pada rangkaian dzikir pagi/petang.","meaning":"Aku memohon ampun kepada Allah dan bertobat kepada-Nya."}];
const petangEntries = [{"no":1,"title":"Ayat Kursi - Surah Al-Baqarah ayat 255","arabic":"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ.\nاللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ.","frequency":"1 kali pada pagi hari. Ayat ini adalah Al-Qur’an, Surah Al-Baqarah [2]:255.","meaning":"Allah, tidak ada sesembahan yang berhak disembah selain Dia, Yang Maha Hidup dan terus-menerus mengurus makhluk-Nya. Dia tidak mengantuk dan tidak tidur. Milik-Nya segala yang ada di langit dan di bumi. Tidak ada yang dapat memberi syafaat di sisi-Nya kecuali dengan izin-Nya. Dia mengetahui apa yang ada di hadapan dan di belakang mereka. Mereka tidak mengetahui apa pun dari ilmu-Nya kecuali apa yang Dia kehendaki. Kursi-Nya meliputi langit dan bumi. Dia tidak merasa berat memelihara keduanya. Dia Mahatinggi lagi Mahaagung."},{"no":2,"title":"Surah Al-Ikhlas","arabic":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ.\nقُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.","frequency":"3 kali pada pagi dan 3 kali pada petang, bersama Al-Falaq dan An-Nas.","meaning":"Dengan nama Allah Yang Maha Pengasih, Maha Penyayang. Katakanlah: Dialah Allah Yang Maha Esa. Allah tempat bergantung segala sesuatu. Dia tidak beranak dan tidak pula diperanakkan. Tidak ada sesuatu pun yang setara dengan-Nya."},{"no":3,"title":"Surah Al-Falaq","arabic":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ.\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ.","frequency":"3 kali pada pagi dan 3 kali pada petang, bersama Al-Ikhlas dan An-Nas.","meaning":"Katakanlah, “Aku berlindung kepada Rabb yang menguasai subuh, dari kejahatan makhluk yang Dia ciptakan, dari kejahatan malam apabila telah gelap, dari kejahatan para peniup pada buhul-buhul, dan dari kejahatan orang yang dengki ketika ia dengki.”"},{"no":4,"title":"Surah An-Nas","arabic":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ.\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ.","frequency":"3 kali pada pagi dan 3 kali pada petang, bersama Al-Ikhlas dan Al-Falaq.","meaning":"Katakanlah, “Aku berlindung kepada Rabb manusia, Raja manusia, sesembahan manusia, dari kejahatan bisikan setan yang bersembunyi, yang membisikkan ke dalam dada manusia, dari golongan jin dan manusia.”"},{"no":5,"title":"Allahumma bika asbahna wa bika amsayna","arabic":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.","frequency":"1 kali pada pagi hari. Untuk petang, ubah susunan awal lafaz menjadi “بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا”.","meaning":"Ya Allah, dengan pertolongan dan kehendak-Mu kami memasuki pagi dan petang. Dengan kehendak-Mu kami hidup dan mati, dan kepada-Mu kami dibangkitkan."},{"no":6,"title":"Asbahna ‘ala fitratil-Islam","arabic":"أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا، وَمَا كَانَ مِنَ الْمُشْرِكِينَ.","frequency":"1 kali pada pagi hari. Lampiran mencantumkan lafaz “أَصْبَحْنَا”.","meaning":"Kami memasuki pagi di atas fitrah Islam, kalimat keikhlasan, agama Nabi kami Muhammad ﷺ, dan millah ayah kami Ibrahim yang lurus serta berserah diri; beliau bukan termasuk orang-orang musyrik."},{"no":7,"title":"Asbahna wa asbahal-mulku lillah","arabic":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ. رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ. رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.","frequency":"1 kali pada pagi hari. Untuk petang terdapat penggantian “أَصْبَحْنَا” menjadi “أَمْسَيْنَا” pada permulaan.","meaning":"Kami memasuki pagi dan seluruh kerajaan adalah milik Allah. Segala puji bagi Allah. Tidak ada sesembahan yang berhak disembah selain Allah semata, tidak ada sekutu bagi-Nya. Milik-Nya kerajaan dan segala pujian, dan Dia Mahakuasa atas segala sesuatu. Rabbku, aku memohon kebaikan hari ini dan kebaikan setelahnya, serta berlindung dari keburukan hari ini dan setelahnya. Aku berlindung dari kemalasan, usia tua yang buruk, azab neraka, dan azab kubur."},{"no":8,"title":"Sayyidul Istighfar","arabic":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.","frequency":"1 kali pada pagi dan 1 kali pada petang.","meaning":"Ya Allah, Engkaulah Rabbku. Tidak ada sesembahan yang berhak disembah selain Engkau. Engkau menciptakanku dan aku adalah hamba-Mu. Aku berpegang pada janji kepada-Mu semampuku. Aku berlindung kepada-Mu dari keburukan perbuatanku. Aku mengakui nikmat-Mu atasku dan mengakui dosaku. Maka ampunilah aku, karena tidak ada yang mengampuni dosa selain Engkau."},{"no":9,"title":"Allahumma ‘afini fi badani","arabic":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ.","frequency":"3 kali pada pagi dan 3 kali pada petang. Kedua bagian doa dibaca dalam rangkaian yang sama.","meaning":"Ya Allah, karuniakanlah keselamatan pada tubuhku, pendengaranku, dan penglihatanku. Tidak ada sesembahan yang berhak disembah selain Engkau. Ya Allah, aku berlindung kepada-Mu dari kekufuran, kefakiran, dan azab kubur. Tidak ada sesembahan yang berhak disembah selain Engkau."},{"no":10,"title":"Allahumma inni as’alukal-‘afwa wal-‘afiyah","arabic":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ. اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي. اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي. اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.","frequency":"1 kali pada pagi dan 1 kali pada petang.","meaning":"Ya Allah, aku memohon ampunan dan keselamatan di dunia dan akhirat. Aku memohon ampunan dan keselamatan dalam agama, urusan dunia, keluarga, dan hartaku. Tutupilah aibku dan tenteramkanlah rasa takutku. Lindungilah aku dari depan, belakang, kanan, kiri, dan atasku. Dengan keagungan-Mu, aku berlindung dari kebinasaan yang datang dari bawahku."},{"no":11,"title":"Allahumma ‘alimal-ghaibi wasy-syahadah","arabic":"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ.","frequency":"1 kali pada pagi, petang, dan sebelum tidur.","meaning":"Ya Allah, Yang mengetahui yang gaib dan yang nyata, Pencipta langit dan bumi, Rabb serta Penguasa segala sesuatu. Aku bersaksi bahwa tidak ada sesembahan yang berhak disembah selain Engkau. Aku berlindung kepada-Mu dari kejahatan diriku, setan dan ajakan kesyirikannya, serta dari melakukan keburukan terhadap diriku atau menyeret seorang Muslim ke dalamnya."},{"no":12,"title":"Bismillahilladzi la yadurru","arabic":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ.","frequency":"3 kali pada pagi dan 3 kali pada petang.","meaning":"Dengan nama Allah, yang bersama nama-Nya tidak ada sesuatu pun di bumi maupun di langit yang dapat menimbulkan mudarat. Dia Maha Mendengar lagi Maha Mengetahui."},{"no":13,"title":"Raditu billahi rabba","arabic":"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.","frequency":"3 kali pada pagi dan 3 kali pada petang.","meaning":"Aku rela Allah sebagai Rabbku, Islam sebagai agamaku, dan Muhammad ﷺ sebagai Nabiku."},{"no":14,"title":"Ya Hayyu ya Qayyum","arabic":"يَا حَيُّ يَا قَيُّومُ، بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.","frequency":"1 kali pada pagi dan 1 kali pada petang.","meaning":"Wahai Yang Maha Hidup dan terus-menerus mengurus seluruh makhluk, dengan rahmat-Mu aku memohon pertolongan. Perbaikilah seluruh urusanku dan jangan serahkan aku kepada diriku sendiri walau sekejap mata."},{"no":15,"title":"La ilaha illallah wahdahu la syarika lah","arabic":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","frequency":"Beberapa riwayat menyebut 1 kali; riwayat lain 10 kali; dan riwayat Abu Hurairah menyebut 100 kali dalam sehari. Lihat rincian di catatan takhrij.","meaning":"Tidak ada sesembahan yang berhak disembah selain Allah semata, tidak ada sekutu bagi-Nya. Milik-Nya kerajaan dan segala pujian, dan Dia Mahakuasa atas segala sesuatu."},{"no":16,"title":"A‘udzu bi kalimatillahi at-tammati","arabic":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.","frequency":"Dibaca 3 kali.","meaning":"Aku berlindung dengan kalimat-kalimat Allah yang sempurna dari kejahatan sesuatu yang diciptakan-Nya."},{"no":17,"title":"Subhanallahi wa bihamdihi","arabic":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.","frequency":"100 kali dalam sehari. Lampiran menempatkannya dalam rangkaian dzikir pagi.","meaning":"Mahasuci Allah dan segala puji bagi-Nya."},{"no":18,"title":"Astaghfirullah wa atubu ilaih","arabic":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ.","frequency":"100 kali dalam sehari, berdasarkan riwayat Sahih Muslim. Lampiran menempatkannya pada rangkaian dzikir pagi/petang.","meaning":"Aku memohon ampun kepada Allah dan bertobat kepada-Nya."}];
let current=4, mode='pagi';
const getEntries=()=>mode==='pagi'?pagiEntries:petangEntries;
const $=id=>document.getElementById(id);
const arabic = $('arabicText'), meaning=$('meaningText'), title=$('entryTitle'), frequency=$('frequencyText');
const titleForEntry = e => { if(mode==='petang' && e.no===6) return 'Amsaina ‘ala fitratil-Islam'; if(mode==='petang' && e.no===7) return 'Amsaina wa amsal-mulku lillah'; return e.title; };
function render(){
 const activeEntries=getEntries();
 const e=activeEntries[current];
 $('counter').textContent=String(e.no).padStart(2,'0')+' / '+String(activeEntries.length).padStart(2,'0');
 $('entryCount').textContent=activeEntries.length+' bacaan';
 title.textContent=titleForEntry(e);
 let displayArabic=e.arabic;
 let displayMeaning=e.meaning;
 let displayFrequency=e.frequency;
 if(mode==='petang' && e.no===5){displayArabic=displayArabic.replace('بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا','بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا');}
 if(mode==='petang' && e.no===6){
   displayArabic=displayArabic.replace('أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ','أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ');
   displayMeaning='Pada waktu sore kami berada di atas fitrah Islam, kalimat ikhlas (dua kalimat syahadat), agama Nabi kami Muhammad ﷺ, dan agama ayah kami Ibrahim yang hanif (lurus), Muslim (tunduk patuh), dan beliau bukan termasuk orang-orang musyrik.';
   displayFrequency='1 kali pada pagi dan 1 kali pada petang. Untuk petang, lafaz awal dibaca “أَمْسَيْنَا”.';
 }
 if(mode==='petang' && e.no===7){displayArabic=displayArabic.replace('أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ','أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ'); displayMeaning=displayMeaning.replace('Kami memasuki pagi','Kami memasuki petang'); displayFrequency='1 kali pada pagi dan 1 kali pada petang. Untuk petang, lafaz awal menjadi “أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ”.';}
 arabic.textContent=displayArabic;
 frequency.textContent=displayFrequency;
 meaning.textContent=displayMeaning;
 document.querySelectorAll('.list-title').forEach((el,i)=>{el.textContent=titleForEntry(activeEntries[i]);});
 $('modeKicker').textContent=mode==='pagi'?'DZIKIR PAGI':'DZIKIR PETANG';
 document.querySelectorAll('[data-mode]').forEach(b=>{const on=b.dataset.mode===mode;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});
 $('prevBtn').disabled=current===0;
 $('nextBtn').innerHTML=current===activeEntries.length-1?'Kembali ke awal <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>':'Bacaan berikutnya <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
 document.querySelectorAll('.list-item').forEach((el,i)=>el.classList.toggle('selected',i===current));
 $('scrollArea').scrollTo({top:0,behavior:'smooth'});
}
function buildList(){
 const activeEntries=getEntries();
 $('listScroll').innerHTML=activeEntries.map((e,i)=>`<button class="list-item" data-index="${i}"><span class="list-num">${String(e.no).padStart(2,'0')}</span><span class="list-copy"><span class="list-title">${escapeHTML(titleForEntry(e))}</span><span class="list-meta">Dzikir ${String(e.no).padStart(2,'0')}</span></span><span class="list-arrow">›</span></button>`).join('');
 $('listScroll').querySelectorAll('[data-index]').forEach(btn=>btn.addEventListener('click',()=>{current=Number(btn.dataset.index);render();closeSheet();}));
}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openSheet(){ $('backdrop').classList.add('open');$('backdrop').setAttribute('aria-hidden','false');$('listScroll').querySelectorAll('.list-item').forEach((el,i)=>el.classList.toggle('selected',i===current)); }
function closeSheet(){ $('backdrop').classList.remove('open');$('backdrop').setAttribute('aria-hidden','true'); }
$('prevBtn').addEventListener('click',()=>{if(current>0){current--;render();}});
$('nextBtn').addEventListener('click',()=>{const a=getEntries();current=(current+1)%a.length;render();});
$('openListTop').addEventListener('click',openSheet);$('openListBottom').addEventListener('click',openSheet);
$('backdrop').addEventListener('click',e=>{if(e.target===$('backdrop'))closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='ArrowRight'){$('nextBtn').click();}if(e.key==='ArrowLeft'){$('prevBtn').click();}});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;current=Math.min(current,getEntries().length-1);buildList();render();}));
let now=new Date();$('clock').textContent=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false});
buildList();render();
</script>
</body></html>
